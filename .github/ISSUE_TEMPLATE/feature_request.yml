name: Feature request
description: An idea for Parley
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The problem, not the solution — what can't you do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like Parley to do
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
