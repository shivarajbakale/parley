<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2b2170"/>
      <stop offset="0.55" stop-color="#15113d"/>
      <stop offset="1" stop-color="#08071c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#8f7dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8f7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="1" r="0.75">
      <stop offset="0" stop-color="#2ee6c5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2ee6c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#cfc6ff"/>
      <stop offset="1" stop-color="#7d6bff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="188"/></clipPath>
  </defs><g transform="translate(512 512) scale(0.8289) translate(-512 -512)"><g clip-path="url(#body)"><!-- glass pill holding the waveform -->
    <rect x="212" y="372" width="600" height="280" rx="140" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="212" y="372" width="600" height="280" rx="140" fill="none" stroke="url(#rim)" stroke-width="3"/>
    <!-- bar glow -->
    <g transform="translate(-10 0)" filter="url(#soft)" fill="#8f7dff" opacity="0.8">
      <rect x="290" y="432" width="44" height="160" rx="22"/>
      <rect x="374" y="352" width="44" height="320" rx="22"/>
      <rect x="458" y="272" width="44" height="480" rx="22"/>
      <rect x="542" y="352" width="44" height="320" rx="22"/>
      <rect x="626" y="412" width="44" height="200" rx="22"/>
      <rect x="710" y="462" width="44" height="100" rx="22"/>
    </g>
    <g transform="translate(-10 0)" fill="url(#bar)">
      <rect x="290" y="432" width="44" height="160" rx="22"/>
      <rect x="374" y="352" width="44" height="320" rx="22"/>
      <rect x="458" y="272" width="44" height="480" rx="22"/>
      <rect x="542" y="352" width="44" height="320" rx="22"/>
      <rect x="626" y="412" width="44" height="200" rx="22"/>
      <rect x="710" y="462" width="44" height="100" rx="22"/>
    </g>
